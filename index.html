<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Синхронный просмотр YouTube</title>
    <!-- Предотвращение запроса favicon.ico (404) -->
    <link rel="icon" href="data:,">
    <style>
        :root {
            --bg: #1a1a2e;
            --card: #16213e;
            --accent: #e94560;
            --text: #eee;
            --muted: #aaa;
            --success: #4caf50;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 300;
            letter-spacing: 1px;
            color: var(--accent);
        }

        .room-section {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .room-section button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .room-section button:hover { filter: brightness(1.2); }
        .room-section button:disabled { background: #555; cursor: not-allowed; }

        .room-id-display {
            font-family: monospace;
            background: #000;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 16px;
            letter-spacing: 1px;
            user-select: all;
        }

        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-group input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #0f0f1a;
            color: var(--text);
            font-size: 14px;
            width: 220px;
        }

        .status {
            margin-left: auto;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            background: #333;
        }
        .status.connected { background: var(--success); color: #000; }
        .status.disconnected { background: #555; }

        .video-url-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .video-url-section input {
            flex: 1;
            min-width: 250px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #0f0f1a;
            color: var(--text);
            font-size: 15px;
        }
        .video-url-section button {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
        }
        .video-url-section button:hover { background: #2980b9; }

        .player-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        #player {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .controls button {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
            min-width: 80px;
        }
        .controls button:hover { background: #34495e; }
        .controls button.primary { background: var(--accent); }
        .controls button.primary:hover { background: #c0392b; }

        .seek-slider {
            flex: 1;
            min-width: 200px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .time-display {
            font-family: monospace;
            font-size: 14px;
            color: var(--muted);
        }

        .sync-btn {
            background: #27ae60 !important;
        }
        .sync-btn:hover { background: #2ecc71 !important; }

        @media (max-width: 600px) {
            .container { padding: 15px; }
            .room-section { flex-direction: column; align-items: stretch; }
            .status { margin-left: 0; text-align: center; }
            .input-group input { width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎬 Синхронный кинозал</h1>

    <!-- Комната -->
    <div class="room-section">
        <button id="btn-create-room">Создать комнату</button>
        <div class="input-group">
            <input type="text" id="join-room-id" placeholder="ID комнаты">
            <button id="btn-join-room">Подключиться</button>
        </div>
        <div class="room-id-display" id="room-id-display">—</div>
        <span class="status disconnected" id="connection-status">Не подключено</span>
    </div>

    <!-- Ввод ссылки на видео -->
    <div class="video-url-section">
        <input type="text" id="video-url" placeholder="Вставьте ссылку на YouTube видео...">
        <button id="btn-load-video">Загрузить</button>
    </div>

    <!-- Плеер -->
    <div class="player-wrapper">
        <div id="player"></div>
    </div>

    <!-- Управление -->
    <div class="controls">
        <button id="btn-play-pause" class="primary">▶ Play</button>
        <input type="range" id="seek-slider" class="seek-slider" min="0" max="100" step="0.1" value="0">
        <span class="time-display" id="time-display">0:00 / 0:00</span>
        <button id="btn-sync-now" class="sync-btn">↻ Синхр.</button>
    </div>
</div>

<!-- PeerJS -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<!-- YouTube Iframe API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
    // ==================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ====================
    let peer = null;
    let conn = null;
    let isHost = false;
    let player = null;
    let playerReady = false;
    let currentVideoId = null;
    let isApplyingRemote = false;
    let pendingCommands = [];      // очередь команд, ожидающих готовности плеера
    let pendingOutgoing = [];      // очередь исходящих команд до открытия соединения
    let pendingPlayState = null;   // желаемое состояние play/pause после загрузки видео (true/false/null)

    // DOM элементы
    const btnCreateRoom = document.getElementById('btn-create-room');
    const btnJoinRoom = document.getElementById('btn-join-room');
    const joinRoomIdInput = document.getElementById('join-room-id');
    const roomIdDisplay = document.getElementById('room-id-display');
    const connectionStatus = document.getElementById('connection-status');
    const videoUrlInput = document.getElementById('video-url');
    const btnLoadVideo = document.getElementById('btn-load-video');
    const btnPlayPause = document.getElementById('btn-play-pause');
    const seekSlider = document.getElementById('seek-slider');
    const timeDisplay = document.getElementById('time-display');
    const btnSyncNow = document.getElementById('btn-sync-now');

    // ==================== ИНИЦИАЛИЗАЦИЯ YOUTUBE PLAYER ====================
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            height: '100%',
            width: '100%',
            videoId: '',
            playerVars: {
                'autoplay': 0,
                'controls': 1,
                'rel': 0,
                'modestbranding': 1,
                'origin': window.location.origin,          // устраняет ошибку postMessage
                'host': 'https://www.youtube-nocookie.com' // используем nocookie-домен
            },
            events: {
                'onReady': onPlayerReady,
                'onStateChange': onPlayerStateChange,
            }
        });
    }

    function onPlayerReady() {
        playerReady = true;
        console.log('YouTube Player готов');
        updateSliderFromPlayer();
        setInterval(updateSliderFromPlayer, 500);
        // применяем все отложенные команды
        while (pendingCommands.length > 0) {
            const cmd = pendingCommands.shift();
            handleIncomingData(cmd);
        }
    }

    function onPlayerStateChange(event) {
        if (isApplyingRemote) return; // изменение вызвано удалённой командой

        // Отправляем состояние партнёру только при локальных действиях
        if (conn && conn.open && playerReady) {
            if (event.data === YT.PlayerState.PLAYING) {
                sendCommand({ type: 'play', currentTime: player.getCurrentTime() });
            } else if (event.data === YT.PlayerState.PAUSED) {
                sendCommand({ type: 'pause', currentTime: player.getCurrentTime() });
            }
        }

        // Применяем отложенное состояние play/pause после загрузки нового видео
        if (pendingPlayState !== null && 
            (event.data === YT.PlayerState.CUED || event.data === YT.PlayerState.PLAYING)) {
            if (pendingPlayState) {
                player.playVideo();
            } else {
                player.pauseVideo();
            }
            pendingPlayState = null;
        }

        updatePlayPauseButton();
    }

    function updatePlayPauseButton() {
        if (!player || !playerReady) return;
        const state = player.getPlayerState();
        btnPlayPause.textContent = (state === YT.PlayerState.PLAYING) ? '⏸ Pause' : '▶ Play';
    }

    // ==================== ФУНКЦИИ ДЛЯ ВИДЕО ====================
    function extractYouTubeId(url) {
        if (!url) return null;
        const patterns = [
            /(?:youtube\.com\/watch\?v=)([^&\s]+)/,
            /(?:youtu\.be\/)([^?\s]+)/,
            /(?:youtube\.com\/embed\/)([^?\s]+)/,
            /(?:youtube\.com\/shorts\/)([^?\s]+)/
        ];
        for (const pattern of patterns) {
            const match = url.match(pattern);
            if (match && match[1]) return match[1];
        }
        if (/^[a-zA-Z0-9_-]{11}$/.test(url.trim())) return url.trim();
        return null;
    }

    /**
     * Загружает видео и при необходимости устанавливает состояние воспроизведения.
     * @param {string} videoId - ID видео YouTube.
     * @param {number} startTime - Время начала (секунды).
     * @param {boolean|null} playState - true = играть, false = пауза, null = не менять.
     */
    function loadVideo(videoId, startTime = 0, playState = null) {
        if (!player || !playerReady) {
            console.warn('loadVideo: плеер не готов, команда поставлена в очередь');
            pendingCommands.push({ type: 'load_video', videoId, currentTime: startTime, isPlaying: playState });
            return;
        }
        if (!videoId) return;

        currentVideoId = videoId;
        pendingPlayState = playState;
        if (startTime > 0) {
            player.loadVideoById({ videoId: videoId, startSeconds: startTime });
        } else {
            player.loadVideoById(videoId);
        }
        updatePlayPauseButton();
    }

    function updateSliderFromPlayer() {
        if (!player || !playerReady || typeof player.getCurrentTime !== 'function') return;
        try {
            const currentTime = player.getCurrentTime() || 0;
            const duration = player.getDuration() || 0;
            if (duration > 0) {
                seekSlider.max = duration;
                seekSlider.value = currentTime;
                timeDisplay.textContent = formatTime(currentTime) + ' / ' + formatTime(duration);
            }
        } catch (e) {}
    }

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return m + ':' + (s < 10 ? '0' : '') + s;
    }

    // ==================== PEERJS / КОМНАТА ====================
    function initPeer() {
        peer = new Peer({ debug: 2 });

        peer.on('open', (id) => {
            console.log('Мой Peer ID:', id);
            if (isHost) {
                roomIdDisplay.textContent = id;
                connectionStatus.textContent = 'Ожидание гостя...';
                connectionStatus.className = 'status disconnected';
            } else {
                const hostId = window.pendingHostId;
                if (hostId && !conn) {
                    const connection = peer.connect(hostId, { reliable: true });
                    conn = connection;
                    setupConnection(connection);
                }
            }
        });

        peer.on('connection', (incomingConn) => {
            if (isHost && !conn) {
                conn = incomingConn;
                setupConnection(conn);
                connectionStatus.textContent = 'Гость подключён!';
                connectionStatus.className = 'status connected';
                sendCurrentState(); // отправляем текущее состояние новому гостю
            } else {
                incomingConn.on('open', () => incomingConn.close());
            }
        });

        peer.on('error', (err) => {
            console.error('PeerJS ошибка:', err);
            alert('Ошибка PeerJS: ' + err.type);
        });
    }

    function setupConnection(connection) {
        connection.on('open', () => {
            console.log('Соединение установлено');
            connectionStatus.textContent = 'Соединено';
            connectionStatus.className = 'status connected';
            while (pendingOutgoing.length > 0) {
                connection.send(pendingOutgoing.shift());
            }
            if (!isHost) {
                sendCommand({ type: 'request_state' });
            }
        });

        connection.on('data', (data) => {
            console.log('Получены данные:', data);
            handleIncomingData(data);
        });

        connection.on('close', () => {
            console.log('Соединение закрыто');
            connectionStatus.textContent = 'Не подключено';
            connectionStatus.className = 'status disconnected';
            conn = null;
        });

        connection.on('error', (err) => {
            console.error('Ошибка соединения:', err);
            connectionStatus.textContent = 'Ошибка соединения';
            connectionStatus.className = 'status disconnected';
        });
    }

    function handleIncomingData(data) {
        if (!data) return;
        if (!playerReady && ['play', 'pause', 'seek', 'load_video', 'sync_state'].includes(data.type)) {
            console.log('handleIncomingData: плеер не готов, команда в очередь', data);
            pendingCommands.push(data);
            return;
        }

        isApplyingRemote = true;
        try {
            switch (data.type) {
                case 'play':
                    if (player && playerReady && data.currentTime !== undefined) {
                        player.seekTo(data.currentTime, true);
                        player.playVideo();
                    }
                    break;
                case 'pause':
                    if (player && playerReady && data.currentTime !== undefined) {
                        player.seekTo(data.currentTime, true);
                        player.pauseVideo();
                    }
                    break;
                case 'seek':
                    if (player && playerReady && data.currentTime !== undefined) {
                        player.seekTo(data.currentTime, true);
                    }
                    break;
                case 'load_video':
                    if (data.videoId) {
                        // Загружаем видео, после загрузки оно будет на паузе (false)
                        loadVideo(data.videoId, data.currentTime || 0, false);
                    }
                    break;
                case 'sync_state':
                    if (data.videoId) {
                        // Загружаем видео с указанием желаемого состояния
                        loadVideo(data.videoId, data.currentTime || 0, data.isPlaying ? true : false);
                    }
                    break;
                case 'request_state':
                    if (isHost) {
                        sendCurrentState();
                    }
                    break;
            }
        } finally {
            setTimeout(() => { isApplyingRemote = false; }, 100);
        }
        updatePlayPauseButton();
    }

    function sendCommand(data) {
        console.log('Попытка отправки команды:', data, 'conn.open =', conn ? conn.open : false);
        if (conn && conn.open) {
            conn.send(data);
        } else if (conn && !conn.open) {
            console.log('Соединение ещё не открыто, команда в очередь отправки');
            pendingOutgoing.push(data);
        } else {
            console.warn('Нет активного соединения, команда не отправлена');
        }
    }

    function sendCurrentState() {
        if (!isHost || !conn || !conn.open || !player || !playerReady || !currentVideoId) return;
        const state = {
            type: 'sync_state',
            videoId: currentVideoId,
            currentTime: player.getCurrentTime() || 0,
            isPlaying: player.getPlayerState() === YT.PlayerState.PLAYING
        };
        conn.send(state);
    }

    // ==================== ОБРАБОТЧИКИ КНОПОК ====================
    btnCreateRoom.addEventListener('click', () => {
        if (peer) peer.destroy();
        isHost = true;
        conn = null;
        pendingOutgoing = [];
        pendingCommands = [];
        initPeer();
        btnCreateRoom.disabled = true;
        btnJoinRoom.disabled = false;
        joinRoomIdInput.disabled = false;
        roomIdDisplay.textContent = '...';
        connectionStatus.textContent = 'Создание...';
    });

    btnJoinRoom.addEventListener('click', () => {
        const hostId = joinRoomIdInput.value.trim();
        if (!hostId) {
            alert('Введите ID комнаты');
            return;
        }
        if (peer) peer.destroy();
        isHost = false;
        conn = null;
        pendingOutgoing = [];
        pendingCommands = [];
        window.pendingHostId = hostId; // сохраняем для подключения после открытия peer
        initPeer();
        btnJoinRoom.disabled = true;
        btnCreateRoom.disabled = false;
        connectionStatus.textContent = 'Подключение...';
        connectionStatus.className = 'status disconnected';
    });

    btnLoadVideo.addEventListener('click', () => {
        const url = videoUrlInput.value.trim();
        const videoId = extractYouTubeId(url);
        if (!videoId) {
            alert('Не удалось распознать ссылку YouTube');
            return;
        }
        // Локально загружаем видео и ставим на паузу (false)
        loadVideo(videoId, 0, false);
        // Отправляем партнёру
        sendCommand({ type: 'load_video', videoId: videoId, currentTime: 0 });
    });

    btnPlayPause.addEventListener('click', () => {
        if (!player || !playerReady) return;
        const state = player.getPlayerState();
        if (state === YT.PlayerState.PLAYING) {
            player.pauseVideo();
        } else {
            player.playVideo();
        }
        // Состояние отправится автоматически через onPlayerStateChange
    });

    seekSlider.addEventListener('change', () => {
        if (!player || !playerReady) return;
        const newTime = parseFloat(seekSlider.value);
        player.seekTo(newTime, true);
        sendCommand({ type: 'seek', currentTime: newTime });
    });

    btnSyncNow.addEventListener('click', () => {
        if (isHost) {
            sendCurrentState();
            alert('Состояние отправлено гостю');
        } else if (conn && conn.open) {
            sendCommand({ type: 'request_state' });
            alert('Запрос отправлен хосту');
        } else {
            alert('Нет соединения');
        }
    });

    // Функция onYouTubeIframeAPIReady вызывается автоматически
</script>
</body>
</html>
