<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Синхронный просмотр YouTube</title>
    <link rel="icon" href="data:,">

    <style>
        :root {
            --bg: #1a1a2e;
            --card: #16213e;
            --accent: #e94560;
            --text: #eee;
            --muted: #aaa;
            --success: #4caf50;
            --touch-target: 44px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 24px;
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin-bottom: 20px;
            color: var(--accent);
            text-align: center;
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .room-section {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .room-section button {
            min-height: var(--touch-target);
            padding: 12px 20px;
            border: 0;
            border-radius: 6px;
            background: var(--accent);
            color: #fff;
            font-size: 16px;
            transition: filter 0.2s;
            white-space: nowrap;
        }

        .room-section button:hover:not(:disabled) {
            filter: brightness(1.2);
        }

        .input-group {
            display: flex;
            flex: 1 1 280px;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .input-group input {
            flex: 1 1 150px;
            width: 220px;
            min-height: var(--touch-target);
            padding: 12px;
            border: 1px solid #444;
            border-radius: 6px;
            outline: none;
            background: #0f0f1a;
            color: var(--text);
            font-size: 16px;
        }

        .input-group input:focus,
        .video-url-section input:focus {
            border-color: var(--accent);
        }

        .room-id-display {
            max-width: 100%;
            padding: 10px 12px;
            overflow-wrap: anywhere;
            border-radius: 6px;
            background: #000;
            color: #fff;
            font-family: monospace;
            font-size: 16px;
            letter-spacing: 1px;
            user-select: all;
        }

        .status {
            margin-left: auto;
            padding: 8px 15px;
            border-radius: 20px;
            background: #333;
            font-size: 14px;
            white-space: nowrap;
        }

        .status.connected {
            background: var(--success);
            color: #000;
        }

        .status.disconnected {
            background: #555;
        }

        .video-url-section {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .video-url-section input {
            flex: 1 1 250px;
            min-height: var(--touch-target);
            padding: 14px;
            border: 1px solid #444;
            border-radius: 8px;
            outline: none;
            background: #0f0f1a;
            color: var(--text);
            font-size: 16px;
        }

        .video-url-section button {
            min-height: var(--touch-target);
            padding: 12px 25px;
            border: 0;
            border-radius: 8px;
            background: #3498db;
            color: #fff;
            font-size: 16px;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .video-url-section button:hover:not(:disabled) {
            background: #2980b9;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            height: 0;
            margin-bottom: 20px;
            padding-bottom: 56.25%;
            overflow: hidden;
            border-radius: 10px;
            background: #000;
        }

        #player {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
        }

        .controls button {
            min-width: 90px;
            min-height: var(--touch-target);
            padding: 12px 20px;
            border: 0;
            border-radius: 6px;
            background: #2c3e50;
            color: #fff;
            font-size: 16px;
            transition: background 0.2s;
        }

        .controls button:hover:not(:disabled) {
            background: #34495e;
        }

        .controls button.primary {
            background: var(--accent);
        }

        .controls button.primary:hover:not(:disabled) {
            background: #c0392b;
        }

        .sync-btn {
            background: #27ae60 !important;
        }

        .sync-btn:hover:not(:disabled) {
            background: #2ecc71 !important;
        }

        .seek-slider {
            flex: 1 1 150px;
            min-width: 150px;
            height: 30px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .time-display {
            color: var(--muted);
            font-family: monospace;
            font-size: 14px;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .room-section {
                flex-direction: column;
                align-items: stretch;
            }

            .input-group {
                width: 100%;
            }

            .input-group input,
            .input-group button {
                width: 100%;
                flex: 1 1 100%;
            }

            .status {
                width: 100%;
                margin-left: 0;
                text-align: center;
            }

            .video-url-section {
                flex-direction: column;
            }

            .video-url-section input,
            .video-url-section button {
                width: 100%;
            }

            .controls {
                gap: 10px;
            }

            .controls button {
                padding: 10px 15px;
                font-size: 15px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 10px;
                border-radius: 12px;
            }

            h1 {
                margin-bottom: 15px;
                font-size: 1.3rem;
            }

            .room-section {
                gap: 10px;
                padding: 12px;
            }

            .room-section button {
                padding: 10px 12px;
                font-size: 15px;
            }

            .room-id-display {
                padding: 8px 10px;
                font-size: 14px;
            }

            .status {
                font-size: 13px;
            }

            .video-url-section input,
            .video-url-section button {
                padding: 12px;
                font-size: 15px;
            }

            .controls button {
                min-width: 70px;
                padding: 10px;
                font-size: 14px;
            }

            .time-display {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
<div class="container">
    <h1>🎬 Синхронный кинозал</h1>

    <div class="room-section">
        <button id="btn-create-room" type="button">Создать комнату</button>

        <div class="input-group">
            <input
                id="join-room-id"
                type="text"
                placeholder="ID комнаты"
                autocomplete="off"
                spellcheck="false"
            >

            <button id="btn-join-room" type="button">
                Подключиться
            </button>
        </div>

        <div id="room-id-display" class="room-id-display">—</div>

        <span id="connection-status" class="status disconnected">
            Не подключено
        </span>
    </div>

    <div class="video-url-section">
        <input
            id="video-url"
            type="text"
            placeholder="Вставьте ссылку на YouTube-видео..."
            autocomplete="off"
        >

        <button id="btn-load-video" type="button">
            Загрузить
        </button>
    </div>

    <div class="player-wrapper">
        <div id="player"></div>
    </div>

    <div class="controls">
        <button id="btn-play-pause" class="primary" type="button">
            ▶️ Воспроизвести
        </button>

        <input
            id="seek-slider"
            class="seek-slider"
            type="range"
            min="0"
            max="0"
            step="0.1"
            value="0"
            aria-label="Перемотка видео"
        >

        <span id="time-display" class="time-display">
            0:00 / 0:00
        </span>

        <button id="btn-sync-now" class="sync-btn" type="button">
            ↻ Синхр.
        </button>
    </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<script>
"use strict";

/* ==================== СОСТОЯНИЕ ==================== */

let peer = null;
let conn = null;
let isHost = false;

let player = null;
let playerReady = false;
let currentVideoId = null;

let isApplyingRemote = false;
let isSeeking = false;

let pendingCommands = [];
let pendingOutgoing = [];
let pendingPlayState = null;

let connectionTimeout = null;
let sliderTimer = null;

const state = {
    hostId: null
};

/* ==================== DOM ==================== */

const btnCreateRoom = document.getElementById("btn-create-room");
const btnJoinRoom = document.getElementById("btn-join-room");
const joinRoomIdInput = document.getElementById("join-room-id");
const roomIdDisplay = document.getElementById("room-id-display");
const connectionStatus = document.getElementById("connection-status");

const videoUrlInput = document.getElementById("video-url");
const btnLoadVideo = document.getElementById("btn-load-video");

const btnPlayPause = document.getElementById("btn-play-pause");
const seekSlider = document.getElementById("seek-slider");
const timeDisplay = document.getElementById("time-display");
const btnSyncNow = document.getElementById("btn-sync-now");

/* ==================== ИНТЕРФЕЙС ==================== */

function setConnectionStatus(text, connected = false) {
    connectionStatus.textContent = text;
    connectionStatus.className = connected
        ? "status connected"
        : "status disconnected";
}

function setRoomControls(mode) {
    const active = mode === "active";

    btnCreateRoom.disabled = active && isHost;
    btnJoinRoom.disabled = active && !isHost;
    joinRoomIdInput.disabled = active && !isHost;
}

function resetConnection() {
    if (connectionTimeout) {
        clearTimeout(connectionTimeout);
        connectionTimeout = null;
    }

    if (conn) {
        try {
            conn.close();
        } catch (_) {
            // Соединение уже могло быть закрыто
        }
    }

    conn = null;
}

/* ==================== YOUTUBE ==================== */

window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player("player", {
        width: "100%",
        height: "100%",
        videoId: "",
        playerVars: {
            autoplay: 0,
            controls: 1,
            rel: 0,
            modestbranding: 1
        },
        events: {
            onReady: onPlayerReady,
            onStateChange: onPlayerStateChange,
            onError: onPlayerError
        }
    });
};

function onPlayerReady() {
    playerReady = true;

    updateSliderFromPlayer();
    updatePlayPauseButton();

    if (sliderTimer === null) {
        sliderTimer = setInterval(updateSliderFromPlayer, 500);
    }

    flushPendingCommands();
}

function onPlayerError(event) {
    console.error("Ошибка YouTube Player:", event.data);
    alert("YouTube не смог загрузить это видео.");
}

function onPlayerStateChange(event) {
    if (!playerReady) {
        return;
    }

    updatePlayPauseButton();

    if (pendingPlayState !== null &&
        (
            event.data === YT.PlayerState.CUED ||
            event.data === YT.PlayerState.PLAYING ||
            event.data === YT.PlayerState.PAUSED
        )) {
        const desiredState = pendingPlayState;
        pendingPlayState = null;

        setTimeout(() => {
            applyPlayState(desiredState);
        }, 100);

        return;
    }

    if (isApplyingRemote || isSeeking || !conn || !conn.open) {
        return;
    }

    if (event.data === YT.PlayerState.PLAYING) {
        sendCommand({
            type: "play",
            currentTime: getCurrentTime()
        });
    } else if (event.data === YT.PlayerState.PAUSED) {
        sendCommand({
            type: "pause",
            currentTime: getCurrentTime()
        });
    }
}

function applyPlayState(shouldPlay) {
    if (!player || !playerReady) {
        return;
    }

    isApplyingRemote = true;

    try {
        if (shouldPlay) {
            player.playVideo();
        } else {
            player.pauseVideo();
        }
    } finally {
        setTimeout(() => {
            isApplyingRemote = false;
        }, 200);
    }
}

function updatePlayPauseButton() {
    if (!player || !playerReady) {
        btnPlayPause.textContent = "▶️ Воспроизвести";
        return;
    }

    const stateValue = player.getPlayerState();

    btnPlayPause.textContent =
        stateValue === YT.PlayerState.PLAYING
            ? "⏸️ Пауза"
            : "▶️ Воспроизвести";
}

function getCurrentTime() {
    if (!player || !playerReady) {
        return 0;
    }

    try {
        return Number(player.getCurrentTime()) || 0;
    } catch (_) {
        return 0;
    }
}

function getDuration() {
    if (!player || !playerReady) {
        return 0;
    }

    try {
        return Number(player.getDuration()) || 0;
    } catch (_) {
        return 0;
    }
}

function updateSliderFromPlayer() {
    if (!player || !playerReady || isSeeking) {
        return;
    }

    const currentTime = getCurrentTime();
    const duration = getDuration();

    if (duration <= 0) {
        return;
    }

    seekSlider.max = String(duration);
    seekSlider.value = String(
        Math.min(Math.max(currentTime, 0), duration)
    );

    timeDisplay.textContent =
        formatTime(currentTime) + " / " + formatTime(duration);
}

function formatTime(seconds) {
    seconds = Math.max(0, Number(seconds) || 0);

    const minutes = Math.floor(seconds / 60);
    const remainingSeconds = Math.floor(seconds % 60);

    return minutes + ":" +
        String(remainingSeconds).padStart(2, "0");
}

/* ==================== YOUTUBE URL ==================== */

function extractYouTubeId(value) {
    if (!value) {
        return null;
    }

    const input = value.trim();

    if (/^[a-zA-Z0-9_-]{11}$/.test(input)) {
        return input;
    }

    try {
        const url = new URL(
            input.startsWith("http") ? input : "https://" + input
        );

        const hostname = url.hostname.toLowerCase();

        if (
            hostname === "youtu.be" ||
            hostname.endsWith(".youtu.be")
        ) {
            const id = url.pathname.split("/").filter(Boolean)[0];
            return isValidYouTubeId(id) ? id : null;
        }

        if (
            hostname === "youtube.com" ||
            hostname.endsWith(".youtube.com")
        ) {
            const pathParts = url.pathname.split("/").filter(Boolean);

            let id = null;

            if (url.pathname === "/watch") {
                id = url.searchParams.get("v");
            } else if (
                pathParts[0] === "embed" ||
                pathParts[0] === "shorts" ||
                pathParts[0] === "live"
            ) {
                id = pathParts[1];
            }

            return isValidYouTubeId(id) ? id : null;
        }
    } catch (_) {
        return null;
    }

    return null;
}

function isValidYouTubeId(id) {
    return typeof id === "string" &&
        /^[a-zA-Z0-9_-]{11}$/.test(id);
}

/* ==================== ВИДЕО ==================== */

function loadVideo(videoId, startTime = 0, playState = false) {
    if (!isValidYouTubeId(videoId)) {
        return;
    }

    currentVideoId = videoId;
    pendingPlayState = playState;

    if (!player || !playerReady) {
        pendingCommands.push({
            type: "load_video",
            videoId,
            currentTime: startTime,
            isPlaying: playState
        });

        return;
    }

    isApplyingRemote = true;

    try {
        player.loadVideoById({
            videoId,
            startSeconds: Math.max(0, Number(startTime) || 0)
        });
    } finally {
        setTimeout(() => {
            isApplyingRemote = false;
        }, 500);
    }

    updatePlayPauseButton();
}

function flushPendingCommands() {
    while (pendingCommands.length > 0) {
        handleIncomingData(pendingCommands.shift());
    }
}

/* ==================== PEERJS ==================== */

function initPeer() {
    if (typeof Peer === "undefined") {
        alert("Не удалось загрузить PeerJS.");
        return;
    }

    peer = new Peer({
        debug: 2
    });

    peer.on("open", handlePeerOpen);

    peer.on("connection", incomingConnection => {
        if (!isHost || conn) {
            incomingConnection.close();
            return;
        }

        conn = incomingConnection;
        setupConnection(conn);
    });

    peer.on("error", error => {
        console.error("Ошибка PeerJS:", error);

        setConnectionStatus(
            "Ошибка: " + (error.type || "неизвестная"),
            false
        );

        if (error.type === "unavailable-id") {
            alert("Этот ID комнаты уже занят. Создайте комнату заново.");
        }
    });

    peer.on("disconnected", () => {
        setConnectionStatus("PeerJS отключён", false);
    });

    peer.on("close", () => {
        setConnectionStatus("Соединение закрыто", false);
    });
}

function handlePeerOpen(id) {
    if (isHost) {
        roomIdDisplay.textContent = id;
        setConnectionStatus("Ожидание гостя...", false);
        return;
    }

    roomIdDisplay.textContent = state.hostId;

    const outgoingConnection = peer.connect(state.hostId, {
        reliable: true
    });
    conn = outgoingConnection;
    setupConnection(outgoingConnection);

    connectionTimeout = setTimeout(() => {
        if (!conn || !conn.open) {
            setConnectionStatus("Не удалось подключиться", false);
            resetConnection();
        }
    }, 10000);
}

function setupConnection(connection) {
    connection.on("open", () => {
        if (connectionTimeout) {
            clearTimeout(connectionTimeout);
            connectionTimeout = null;
        }

        setConnectionStatus("Соединено", true);

        while (pendingOutgoing.length > 0) {
            connection.send(pendingOutgoing.shift());
        }

        if (isHost) {
            sendCurrentState();
        } else {
            sendCommand({ type: "request_state" });
        }
    });

    connection.on("data", handleIncomingData);

    connection.on("close", () => {
        if (conn === connection) {
            conn = null;
        }

        setConnectionStatus("Не подключено", false);
    });

    connection.on("error", error => {
        console.error("Ошибка соединения:", error);

        if (conn === connection) {
            conn = null;
        }

        setConnectionStatus("Ошибка соединения", false);
    });
}

/* ==================== ОБМЕН ДАННЫМИ ==================== */

function sendCommand(data) {
    if (!data || !data.type) {
        return;
    }

    if (conn && conn.open) {
        try {
            conn.send(data);
        } catch (error) {
            console.error("Ошибка отправки данных:", error);
        }

        return;
    }

    if (conn && !conn.open) {
        pendingOutgoing.push(data);
    }
}

function sendCurrentState() {
    if (
        !isHost ||
        !conn ||
        !conn.open ||
        !player ||
        !playerReady ||
        !currentVideoId
    ) {
        return;
    }

    sendCommand({
        type: "sync_state",
        videoId: currentVideoId,
        currentTime: getCurrentTime(),
        isPlaying: player.getPlayerState() === YT.PlayerState.PLAYING
    });
}

function handleIncomingData(data) {
    if (!data || typeof data !== "object" || !data.type) {
        return;
    }

    const commandsRequiringPlayer = [
        "play",
        "pause",
        "seek",
        "load_video",
        "sync_state"
    ];

    if (
        !playerReady &&
        commandsRequiringPlayer.includes(data.type)
    ) {
        pendingCommands.push(data);
        return;
    }

    switch (data.type) {
        case "load_video":
            if (data.videoId) {
                loadVideo(
                    data.videoId,
                    data.currentTime || 0,
                    false
                );
            }
            break;

        case "sync_state":
            if (data.videoId) {
                loadVideo(
                    data.videoId,
                    data.currentTime || 0,
                    Boolean(data.isPlaying)
                );
            }
            break;

        case "play":
            applyRemoteTimeAndState(
                data.currentTime,
                true
            );
            break;

        case "pause":
            applyRemoteTimeAndState(
                data.currentTime,
                false
            );
            break;

        case "seek":
            applyRemoteSeek(data.currentTime);
            break;

        case "request_state":
            if (isHost) {
                sendCurrentState();
            }
            break;

        default:
            console.warn("Неизвестная команда:", data.type);
    }
}

function applyRemoteTimeAndState(time, shouldPlay) {
    if (!player || !playerReady) {
        return;
    }

    isApplyingRemote = true;

    try {
        if (Number.isFinite(Number(time))) {
            player.seekTo(Math.max(0, Number(time)), true);
        }

        if (shouldPlay) {
            player.playVideo();
        } else {
            player.pauseVideo();
        }
    } finally {
        setTimeout(() => {
            isApplyingRemote = false;
        }, 300);
    }
}

function applyRemoteSeek(time) {
    if (!player || !playerReady || !Number.isFinite(Number(time))) {
        return;
    }

    isApplyingRemote = true;

    try {
        player.seekTo(Math.max(0, Number(time)), true);
    } finally {
        setTimeout(() => {
            isApplyingRemote = false;
        }, 200);
    }
}

/* ==================== КНОПКИ ==================== */

btnCreateRoom.addEventListener("click", () => {
    resetConnection();

    if (peer) {
        peer.destroy();
        peer = null;
    }

    isHost = true;
    state.hostId = null;
    pendingCommands = [];
    pendingOutgoing = [];

    roomIdDisplay.textContent = "...";
    setConnectionStatus("Создание комнаты...", false);

    btnCreateRoom.disabled = true;
    btnJoinRoom.disabled = false;
    joinRoomIdInput.disabled = false;

    initPeer();
});

btnJoinRoom.addEventListener("click", () => {
    const hostId = joinRoomIdInput.value.trim();

    if (!hostId) {
        alert("Введите ID комнаты.");
        joinRoomIdInput.focus();
        return;
    }

    resetConnection();

    if (peer) {
        peer.destroy();
        peer = null;
    }

    isHost = false;
    state.hostId = hostId;
    pendingCommands = [];
    pendingOutgoing = [];

    roomIdDisplay.textContent = hostId;
    setConnectionStatus("Подключение...", false);

    btnJoinRoom.disabled = true;
    btnCreateRoom.disabled = false;
    joinRoomIdInput.disabled = false;

    initPeer();
});

btnLoadVideo.addEventListener("click", () => {
    const videoId = extractYouTubeId(videoUrlInput.value);

    if (!videoId) {
        alert("Не удалось распознать ссылку YouTube.");
        return;
    }

    loadVideo(videoId, 0, false);

    sendCommand({
        type: "load_video",
        videoId,
        currentTime: 0,
        isPlaying: false
    });
});

btnPlayPause.addEventListener("click", () => {
    if (!player || !playerReady) {
        return;
    }

    const currentState = player.getPlayerState();
    const shouldPlay = currentState !== YT.PlayerState.PLAYING;

    applyPlayState(shouldPlay);

    sendCommand({
        type: shouldPlay ? "play" : "pause",
        currentTime: getCurrentTime()
    });
});

seekSlider.addEventListener("input", () => {
    const duration = getDuration();

    if (duration > 0) {
        timeDisplay.textContent =
            formatTime(Number(seekSlider.value)) +
            " / " +
            formatTime(duration);
    }
});

seekSlider.addEventListener("pointerdown", () => {
    isSeeking = true;
});

seekSlider.addEventListener("pointerup", () => {
    isSeeking = false;
});

seekSlider.addEventListener("change", () => {
    if (!player || !playerReady) {
        return;
    }

    const newTime = Number(seekSlider.value);

    isApplyingRemote = true;

    try {
        player.seekTo(newTime, true);
    } finally {
        setTimeout(() => {
            isApplyingRemote = false;
        }, 200);
    }

    sendCommand({
        type: "seek",
        currentTime: newTime
    });
});

btnSyncNow.addEventListener("click", () => {
    if (isHost) {
        sendCurrentState();
        alert("Состояние отправлено гостю.");
    } else if (conn && conn.open) {
        sendCommand({ type: "request_state" });
        alert("Запрос отправлен хосту.");
    } else {
        alert("Нет соединения.");
    }
});

joinRoomIdInput.addEventListener("keydown", event => {
    if (event.key === "Enter") {
        btnJoinRoom.click();
    }
});

videoUrlInput.addEventListener("keydown", event => {
    if (event.key === "Enter") {
        btnLoadVideo.click();
    }
});

window.addEventListener("beforeunload", () => {
    if (connectionTimeout) {
        clearTimeout(connectionTimeout);
    }

    if (sliderTimer) {
        clearInterval(sliderTimer);
    }

    if (peer) {
        peer.destroy();
    }
});
</script>
</body>
</html>
